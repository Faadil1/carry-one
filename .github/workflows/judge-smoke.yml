name: Judge Window Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed NimCarry base URL to check"
        required: true
        default: "https://carry-one-sip-show.vercel.app"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run judge-window smoke check
        run: node scripts/judge-smoke.mjs "${{ inputs.base_url }}"

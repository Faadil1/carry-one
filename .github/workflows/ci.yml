name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Public-repo secret scan
        run: node scripts/secret-scan.mjs

      - name: Browser JavaScript syntax
        run: node --check web/app.js && node --check web/http-compat.js && node --check web/winning-intelligence.js && node --check web/demo-ux.js

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

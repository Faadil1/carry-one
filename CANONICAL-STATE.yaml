core_product_laws:
  baton: >-
    THE BATON IS A VERIFIED 1-NIM HANDOFF — NOT AN INVESTMENT,
    WAGER, PRIZE POOL OR UNIQUE-HUMAN PROOF.
  destination: EVERY BATON HAS A DESTINATION.
  consent: NO ONE BECOMES A BRIDGE BY SURPRISE.
  custody: THE PATH CHANGES ONLY AFTER VERIFIED FINALITY.
  decline: A DECLINE LEAVES CUSTODY WHERE IT IS.
  arrival: THE MISSION ENDS ONLY WHEN THE DESTINATION BECOMES THE FINALIZED RECIPIENT.
  reward: THE PATH IS THE PRODUCT.

product_positioning:
  category: destination_bound_human_routing
  working_promise: >-
    Get this to someone you cannot reach directly — one human bridge at a time.
  holder_question: Who can move this one person closer?
  emotional_loop: >-
    I was chosen -> I can move this closer -> I leave a verified place in the path -> I can see if it arrives.

mvp_state_contract:
  mission_states:
    - ACTIVE
    - ARRIVED
    - CANCELLED
  invitation_states:
    - INVITED
    - ACCEPTED
    - DECLINED
    - EXPIRED
    - WITHDRAWN
    - COMPLETED
  invitation_open_states:
    - INVITED
    - ACCEPTED
  hop_states:
    - PENDING
    - INCLUDED
    - FINAL
    - INVALID
  one_active_invitation_per_mission: true
  invitation_expiry_hours: 12
  accepted_pass_deadline_minutes: 60
  recipient_value_luna: 100000
  next_pass_unlock: FINAL
  invitation_success_terminal_state: COMPLETED
  mission_cancel_after_first_final_hop: forbidden
  cancel_or_reroute_after_broadcast: forbidden_fail_closed
  arrival_condition: finalized_recipient_hmac_equals_private_target_wallet_hmac

five_screen_contract:
  spec: docs/REACH-MISSION-UX-STATE-CONTRACT.md
  screens:
    - Mission_Home
    - Create_Mission
    - Bridge_Invitation
    - Pass_1_NIM
    - Route_Arrival

foundation_implementation:
  branch: foundation/reach-mission-slice-1
  pull_request: 5
  code_verification_head: 87ec3581de23ea972656076f5610ce0402612301
  modules:
    - src/mission/types.ts
    - src/mission/repository.ts
    - src/mission/file-repository.ts
    - src/mission/target-wallet-crypto.ts
    - src/mission/wallet-auth.ts
    - src/mission/service.ts
    - src/mission/coordinator.ts
    - src/persistence/file-relay-store.ts
  runtime_changes:
    - RelayStore snapshot/hydration boundary
    - durable file relay adapter for restart-recovery proof
    - optional CARRY_ONE_RELAY_STATE_FILE runtime binding
    - mission/relay coordinator with crash-window repair
  migration:
    file: migrations/001_reach_mission_foundation.sql
    target: PostgreSQL_or_compatible
  implementation_discoveries:
    invitation_completed_state:
      decision: REQUIRED
      reason: >-
        A successful finalized pass needs an explicit terminal invitation state;
        ACCEPTED cannot remain open after canonical custody advances.
    durable_pass_intents:
      decision: REQUIRED
      reason: >-
        Restart safety is incomplete if mission/invitation records persist while the
        exact active pass intent and broadcast hash exist only in process memory.

persistence_contract:
  spec: docs/REACH-MISSION-PERSISTENCE.sql
  local_proof_adapter: FileMissionRepository_plus_FileRelayStore
  production_target: PostgreSQL_or_compatible
  durable_entities:
    - missions
    - invitations
    - pass_intents
    - hops
    - participants
    - auth_challenges
    - audit_events
  target_wallet_storage:
    authenticated_encryption: AES_256_GCM
    keyed_hmac_for_equality: HMAC_SHA256
    encryption_and_hmac_keys_separate: required
    plaintext_target_in_normal_dto: forbidden
    plaintext_hash_only: forbidden
  invariants:
    - one_open_invitation_per_mission
    - one_hop_sequence_per_mission
    - global_tx_hash_uniqueness
    - durable_active_pass_state
    - atomic_finalization_updates_holder_sequence_invitation_and_arrival
    - restart_recovery_of_active_intent_and_broadcast
    - crash_window_final_projection_is_idempotently_repairable

security_contract:
  spec: docs/REACH-MISSION-SECURITY-AUTH.md
  nimiq_wallet_auth:
    canonical_domain: carry-one:v1
    challenge_ttl_minutes: 5
    nonce_minimum_bits: 128
    one_time_consume: true
    verify_public_key_to_claimed_wallet: true
    nimiq_signed_message_prefix_compatible: true
  signed_actions:
    - CREATE_MISSION
    - CREATE_INVITATION
    - ACCEPT_INVITATION
    - WITHDRAW_INVITATION
    - AUTHORIZE_PASS
    - CANCEL_MISSION
  invite_token:
    entropy_bits: 256
    server_storage: SHA256_hash_only
    default_ttl_hours: 12
    bearer_power: locate_invitation_and_low_risk_decline_only
    acceptance_requires_wallet_signature: true
  target_wallet_api_public: false

api_contract:

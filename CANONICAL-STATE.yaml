core_product_laws:
  baton: >-
    THE BATON IS A VERIFIED 1-NIM HANDOFF — NOT AN INVESTMENT,
    WAGER, PRIZE POOL OR UNIQUE-HUMAN PROOF.
  destination: EVERY BATON HAS A DESTINATION.
  consent: NO ONE BECOMES A BRIDGE BY SURPRISE.
  custody: THE PATH CHANGES ONLY AFTER VERIFIED FINALITY.
  decline: A DECLINE LEAVES CUSTODY WHERE IT IS.
  arrival: THE MISSION ENDS ONLY WHEN THE DESTINATION BECOMES THE FINALIZED RECIPIENT.
  reward: THE PATH IS THE PRODUCT.

product_positioning:
  category: destination_bound_human_routing
  working_promise: >-
    Get this to someone you cannot reach directly — one human bridge at a time.
  holder_question: Who can move this one person closer?
  emotional_loop: >-
    I was chosen -> I can move this closer -> I leave a verified place in the path -> I can see if it arrives.
  primary_audience:
    - builder_and_hackathon_communities
    - open_source_communities
    - professional_and_founder_groups
    - interest_based_online_communities

mvp_state_contract:
  mission_states:
    - ACTIVE
    - ARRIVED
    - CANCELLED
  invitation_states:
    - INVITED
    - ACCEPTED
    - DECLINED
    - EXPIRED
    - WITHDRAWN
  hop_states:
    - PENDING
    - INCLUDED
    - FINAL
    - INVALID
  one_active_invitation_per_mission: true
  invitation_expiry_hours: 12
  accepted_pass_deadline_minutes: 60
  recipient_value_luna: 100000
  next_pass_unlock: FINAL
  mission_cancel_after_first_final_hop: forbidden
  cancel_or_reroute_after_broadcast: forbidden_fail_closed
  arrival_condition: finalized_recipient_equals_private_target_wallet

five_screen_contract:
  - Mission_Home
  - Create_Mission
  - Bridge_Invitation
  - Pass_1_NIM
  - Route_Arrival
  spec: docs/REACH-MISSION-UX-STATE-CONTRACT.md

persistence_contract:
  spec: docs/REACH-MISSION-PERSISTENCE.sql
  database_shape: postgres_or_compatible
  durable_entities:
    - missions
    - invitations
    - hops
    - participants
    - auth_challenges
    - audit_events
  target_wallet_storage:
    ciphertext: required
    keyed_hmac_for_equality: required
    plaintext_hash_only: forbidden
  invariants:
    - one_open_invitation_per_mission
    - one_hop_sequence_per_mission
    - global_tx_hash_uniqueness
    - atomic_finalization_updates_holder_sequence_and_arrival

security_contract:
  spec: docs/REACH-MISSION-SECURITY-AUTH.md
  nimiq_wallet_auth:
    provider_method: sign
    canonical_domain: carry-one:v1
    challenge_ttl_minutes: 5
    one_time_nonce: true
    verify_public_key_to_claimed_wallet: true
  signed_actions:
    - CREATE_MISSION
    - CREATE_INVITATION
    - ACCEPT_INVITATION
    - WITHDRAW_INVITATION
    - AUTHORIZE_PASS
    - CANCEL_MISSION
  invite_token:
    entropy_bits_minimum: 256
    server_storage: hash_only
    default_ttl_hours: 12
    bearer_power: locate_invitation_and_low_risk_decline_only
    acceptance_requires_wallet_signature: true
  target_wallet_api_public: false

api_contract:
  spec: docs/REACH-MISSION-API-CONTRACT.md
  public_target_wallet_field: forbidden
  normal_wallet_rendering: fingerprint_only
  mutation_idempotency: required
  target_wallet_allowed_client_response: >-
    Never as mission target metadata. A recipient wallet may be returned only to the authenticated
    current holder inside a server-authorized pass intent after a bridge has accepted.

test_contract:
  spec: docs/REACH-MISSION-TEST-MATRIX.md
  required_families:
    - mission_creation
    - invitation_single_open_rule
    - accept_decline_expiry_withdraw
    - holder_signature_authorization
    - pass_and_finality
    - target_arrival
    - reroute
    - mission_cancellation
    - privacy_redaction
    - invite_token_threats
    - five_screen_state_assertions
    - real_usage_instrumentation


core_product_laws:
  baton: THE BATON IS A VERIFIED 1-NIM HANDOFF — NOT AN INVESTMENT, WAGER, PRIZE POOL OR UNIQUE-HUMAN PROOF.
  destination: EVERY BATON HAS A DESTINATION.
  consent: NO ONE BECOMES A BRIDGE BY SURPRISE.
  custody: THE PATH CHANGES ONLY AFTER VERIFIED FINALITY.
  decline: A DECLINE LEAVES CUSTODY WHERE IT IS.
  arrival: THE MISSION ENDS ONLY WHEN THE DESTINATION BECOMES THE FINALIZED RECIPIENT.
  reward: THE PATH IS THE PRODUCT.

product_positioning:
  category: destination_bound_human_routing
  holder_question: Who can move this one person closer?
  native_nimiq_thesis: NIM_AS_COORDINATION_PRIMITIVE_NOT_JUST_PAYMENT
  one_nim_semantics: SEMANTIC_STATE_BEARING_BATON_NOT_ECONOMIC_INCENTIVE
  simple_judge_flow: [Create, Invite, Accept, Pass_1_NIM, Arrive]
  front_door_language: HUMAN_ROUTING_NOT_CRYPTO_PAYMENT_APP
  primary_judge_line: NimCarry uses 1 NIM to make warm introductions verifiable.
  baton_disambiguation: The 1 NIM is the baton, not the reward.
  cycle_ii_target_policy:
    known_target_wallet_required: true
    creator_attested_target_consent_required: true
  competitor_differentiation:
    generic_relay_or_gift_chain: false
    destination_bound_route: true
    consented_human_bridges: true
    finality_verified_chain_of_custody: true
    distinct_terminal_arrival: true

mvp_contract:
  recipient_value_luna: 100000
  requested_fee_luna: 0
  next_pass_unlock: FINAL
  one_active_invitation_per_mission: true
  finalized_route_wallet_reuse: forbidden
  cancel_or_reroute_after_broadcast: forbidden_fail_closed
  arrival_condition: finalized_recipient_hmac_equals_private_target_wallet_hmac
  five_screens: [Mission_Home, Create_Mission, Bridge_Invitation, Pass_1_NIM, Route_Arrival]
  gamification: forbidden

judge_demo_law:

  auth_domain: carry-one:v1
  challenge_ttl_minutes: 5
  nonce_minimum_bits: 128
  one_time_challenge: true
  invite_token_bits: 256
  invite_token_server_storage: SHA256_hash_only
  target_wallet_encryption: AES_256_GCM
  target_wallet_equality: keyed_HMAC_SHA256
  separate_encryption_and_hmac_keys: required
  target_wallet_in_normal_dto: forbidden
  signed_actions:

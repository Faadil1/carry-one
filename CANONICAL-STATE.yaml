core_product_laws:
  baton: >-
    THE BATON IS A VERIFIED 1-NIM HANDOFF — NOT AN INVESTMENT,
    WAGER, PRIZE POOL OR UNIQUE-HUMAN PROOF.
  destination: EVERY BATON HAS A DESTINATION.
  consent: NO ONE BECOMES A BRIDGE BY SURPRISE.
  custody: THE PATH CHANGES ONLY AFTER VERIFIED FINALITY.
  decline: A DECLINE LEAVES CUSTODY WHERE IT IS.
  arrival: THE MISSION ENDS ONLY WHEN THE DESTINATION BECOMES THE FINALIZED RECIPIENT.
  reward: THE PATH IS THE PRODUCT.

product_positioning:
  category: destination_bound_human_routing
  primary_problem: >-
    Warm introductions and community routing become opaque after the first handoff;
    Carry One gives the request a verified chain of custody until it reaches one destination.
  primary_audience:
    - builder_and_hackathon_communities
    - open_source_communities
    - professional_and_founder_groups
    - interest_based_online_communities
  working_promise: >-
    Get this to someone you cannot reach directly — one human bridge at a time.
  holder_question: Who can move this one person closer?
  emotional_loop: >-
    I was chosen -> I can move this closer -> I leave a verified place in the path -> I can see if it arrives.

collision_scan:
  nimiq_cycle2_nim_relay:
    risk: HIGH_FOR_GENERIC_RELAY
    avoid:
      - generic_one_coin_journey_positioning
      - skill_challenges_before_pass
      - streaks
      - leaderboards
      - country_or_map_progression_as_core
  nimiq_cycle2_ralli:
    risk: MEDIUM_HIGH_FOR_CHALLENGE_CHAIN
    avoid:
      - social_challenge_feed
      - response_chain_as_core
      - boosted_reward_pool
      - creator_tipping_as_core
  cycle1_62_entry_scan:
    result: >-
      Dense in payments, rewards, games, challenges, gifting, bounties, savings,
      commerce, proof and creator tools; no identified entry uses destination-bound
      sequential human routing with one canonical transferable baton as its core.
  white_space: >-
    A consented, destination-specific referral path whose chain of custody is verified by Nimiq.

mvp_contract:
  mission_target:
    target_wallet: required_private_server_side
    target_label: required
    mission_note: short
  invitation:
    states:
      - INVITED
      - ACCEPTED
      - DECLINED
      - EXPIRED
    suggested_expiry_hours: 12
    accepted_before_payment: true
  pass:
    recipient_value_luna: 100000
    fee_part_of_amount_validation: false
    canonical_confirmation_states:
      - PENDING
      - INCLUDED
      - FINAL
    next_pass_unlock: FINAL
  reroute: invite_another_candidate_before_any_finalized_pass
  dormant_behavior: display_only_no_clawback_no_reassignment
  five_screens:
    - Mission_Home
    - Create_Mission
    - Bridge_Invitation
    - Pass_1_NIM
    - Route_Arrival

privacy:
  target_wallet_public: false
  full_wallet_addresses_in_ui: false
  participant_names: opt_in_only
  why_you_visibility: participant_only
  public_named_target: consent_or_legitimate_public_launch_basis_required

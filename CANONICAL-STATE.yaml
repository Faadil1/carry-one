onchain_commitment:
  required_for_reach_mission: true
  format: co:v1:<opaque-sha256-base64url>
  max_bytes: 64
  binds:
    - mission_id
    - sequence
    - current_holder
    - accepted_recipient
    - random_pass_nonce
  cleartext_mission_id: false
  transaction_anonymity_claim: false
  public_chain_sender_recipient_value_acknowledged: true

nimiq_pay:
  expected_holder_account_preflight: listAccounts
  sender_force_supported_by_client: false
  actual_sender_backend_verification: authoritative
  send_method: sendBasicTransactionWithData
  recipient_value_luna: 100000
  fee_luna: 0
  data_required: true

rpc_resilience:
  multiple_read_endpoints_supported: true
  env: NIMIQ_RPC_URLS
  primary_failure_fallback: true
  all_endpoints_unavailable_error: VERIFICATION_DELAYED
  infrastructure_failure_marks_tx_invalid: false

persistence:

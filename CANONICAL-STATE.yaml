core_product_laws:
  baton: >-
    THE BATON IS A VERIFIED 1-NIM HANDOFF — NOT AN INVESTMENT,
    WAGER, PRIZE POOL OR UNIQUE-HUMAN PROOF.
  destination: EVERY BATON HAS A DESTINATION.
  consent: NO ONE BECOMES A BRIDGE BY SURPRISE.
  custody: THE PATH CHANGES ONLY AFTER VERIFIED FINALITY.
  decline: A DECLINE LEAVES CUSTODY WHERE IT IS.
  arrival: THE MISSION ENDS ONLY WHEN THE DESTINATION BECOMES THE FINALIZED RECIPIENT.
  reward: THE PATH IS THE PRODUCT.

product_positioning:
  category: destination_bound_human_routing
  working_promise: >-
    Get this to someone you cannot reach directly — one human bridge at a time.
  holder_question: Who can move this one person closer?

mvp_contract:
  mission_states: [ACTIVE, ARRIVED, CANCELLED]
  invitation_states: [INVITED, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN, COMPLETED]
  invitation_open_states: [INVITED, ACCEPTED]
  hop_states: [PENDING, INCLUDED, FINAL, INVALID]
  invitation_expiry_hours: 12
  accepted_pass_deadline_minutes: 60
  recipient_value_luna: 100000
  next_pass_unlock: FINAL
  one_active_invitation_per_mission: true
  cancel_or_reroute_after_broadcast: forbidden_fail_closed
  arrival_condition: finalized_recipient_hmac_equals_private_target_wallet_hmac
  five_screens:
    - Mission_Home
    - Create_Mission
    - Bridge_Invitation
    - Pass_1_NIM
    - Route_Arrival

